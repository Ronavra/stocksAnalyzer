name: Assumed-Open Pilot Tracking
on:
  workflow_dispatch:
  schedule:
    # Wednesday-Saturday UTC, after prior US trading day's closing data is expected.
    - cron: '30 2 * * 3-6'
permissions:
  contents: read
concurrency:
  group: stocks-analyzer-pilot-ledger
  cancel-in-progress: false
jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Track immutable assumed-open pilot and SPY benchmark
        run: python scripts/track_real_money_pilot.py
