name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile research pipeline
        run: >
          python -m py_compile
          scripts/build_daily_price_features.py
          scripts/ingest_sec_fundamentals.py
          scripts/generate_weekly_signals.py
          scripts/run_weekly_cycle.py
          scripts/validate_daily_cycle.py
          scripts/backtest_calibrated_model.py
          scripts/ablation_predictive_model.py
          scripts/build_daily_valuation.py
          app/research/calibrated_model.py
          app/research/weekly_ranker.py
          app/research/financial_ranking.py
          scripts/compare_financial_ranking.py
          scripts/refresh_analyst_consensus.py
          app/research/analyst_consensus.py
          app/providers/analyst_consensus.py
          app/research/weekly_rank_metrics.py
          app/research/signal_execution.py
          scripts/validate_weekly_ranker.py
          app/providers/sec.py
          app/providers/twelvedata.py
          app/providers/massive.py
      - name: Test research model and validation gate
        run: python -m pytest tests -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Build and typecheck web application
        run: npm run build
