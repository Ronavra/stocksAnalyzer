name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-compile:
    runs-on: ubuntu-24.04
    env:
      TEST_ARCHIVE_PG_DSN: postgresql://postgres:postgres@localhost:5432/archive_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements-archive.txt
      - run: pip install -r requirements-archive.txt
      - name: Start disposable archive integration database
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb archive_test
      - name: Parse Windows setup scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Verify time zones without a system database
        env:
          PYTHONTZPATH: ""
        run: python -c "from zoneinfo import ZoneInfo; import app.market_calendar; assert ZoneInfo('America/New_York').key == 'America/New_York'; assert ZoneInfo('Asia/Jerusalem').key == 'Asia/Jerusalem'"
      - name: Compile research pipeline
        run: python -m compileall -q app scripts
      - name: Test research model and validation gate
        run: python -m pytest tests -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Build and typecheck web application
        run: npm run build
