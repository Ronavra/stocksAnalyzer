name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-compile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ARCHIVE_PG_DSN: postgresql://postgres:postgres@localhost:5432/archive_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements-archive.txt
      - run: pip install -r requirements-archive.txt
      - name: Verify time zones without a system database
        env:
          PYTHONTZPATH: ""
        run: python -c "from zoneinfo import ZoneInfo; import app.market_calendar; assert ZoneInfo('America/New_York').key == 'America/New_York'; assert ZoneInfo('Asia/Jerusalem').key == 'Asia/Jerusalem'"
      - name: Compile research pipeline
        run: python -m compileall -q app scripts
      - name: Test research model and validation gate
        run: python -m pytest tests -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Build and typecheck web application
        run: npm run build
