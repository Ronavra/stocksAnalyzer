name: Critical Financial Weekly Recovery
on:
  workflow_dispatch:
    inputs:
      signal_date:
        description: Latest unstarted cohort date to replace
        required: true
        type: string
      reason:
        description: Auditable correction reason
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stocks-analyzer-critical-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      # Recovery requires an explicit date and reason; routine source updates
      # must never launch the historical one-time correction again.
      RECOVERY_DATE: ${{ inputs.signal_date }}
      RECOVERY_REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Close expired daily refresh leases
        run: python -c "from dotenv import load_dotenv; load_dotenv(); from app.db.client import get_supabase; print(get_supabase().rpc('expire_daily_market_refreshes').execute().data)"
      - name: Re-extract every company from official SEC facts
        run: python scripts/refresh_research_sources.py --sec-only --max-age-hours 0
      - name: Refresh earnings evidence
        run: python scripts/refresh_research_sources.py --earnings-only --max-age-hours 4
      - name: Refresh analyst consensus
        continue-on-error: true
        run: python scripts/refresh_analyst_consensus.py --max-age-hours 24
      - name: Verify observed financial feature runtime
        run: python scripts/check_predictive_feature_health.py
      - name: Preview corrected weekly selection
        run: python scripts/generate_weekly_signals.py --dry-run
      - name: Replace the authorized current week atomically
        run: python scripts/generate_weekly_signals.py --replace-week "$RECOVERY_DATE" --reason "$RECOVERY_REASON"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-financial-recovery-audit
          path: |
            services/api/sec_fundamentals_audit.json
            services/api/financial_selection.json
            services/api/predictive_feature_health.json
          if-no-files-found: ignore
