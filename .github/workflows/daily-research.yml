name: Daily Market Research

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Explicitly rerun even after a successful refresh today"
        type: boolean
        default: false
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Jerusalem"
  push:
    branches: [main]
    paths:
      - "services/api/scripts/run_daily_cycle.py"
      - "services/api/scripts/sync_sp500.py"
      - ".github/workflows/daily-research.yml"

concurrency:
  group: stocks-analyzer-market-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FORCE_DAILY_REFRESH: ${{ inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile critical Python files
        run: python -m py_compile scripts/run_daily_cycle.py scripts/run_scheduled_daily.py scripts/validate_daily_cycle.py scripts/ingest_prices.py scripts/build_daily_price_features.py scripts/scan_setups.py scripts/refresh_research_sources.py scripts/ingest_sec_fundamentals.py scripts/build_daily_valuation.py scripts/ingest_massive_earnings.py app/providers/twelvedata.py app/providers/sec.py app/providers/massive.py app/market_calendar.py
      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$TWELVE_DATA_API_KEY"
          test -n "$MASSIVE_API_KEY"
      - name: Skip duplicate daily refresh
        id: daily_gate
        run: python scripts/daily_run_gate.py
      - name: Refresh market research and evaluate matured signals
        id: market_refresh
        if: steps.daily_gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/run_daily_cycle.py
      - name: Retry failed market refresh within the same workflow
        if: steps.market_refresh.outcome == 'failure'
        env:
          PRICE_CREDIT_BUDGET: '150'
        run: python scripts/run_daily_cycle.py
      - name: Confirm persisted pipeline health
        if: success() && steps.daily_gate.outputs.sources == 'true'
        run: python scripts/validate_daily_cycle.py
      - name: Refresh Massive earnings
        if: success() && steps.daily_gate.outputs.sources == 'true'
        run: python scripts/refresh_research_sources.py --earnings-only --max-age-hours 4
      - name: Backfill earnings for newly added or uncovered companies
        if: success() && steps.daily_gate.outputs.sources == 'true'
        run: python scripts/ingest_massive_earnings.py --backfill-missing
      - name: Refresh SEC fundamentals and valuation
        id: sec_refresh
        if: ${{ !cancelled() && steps.daily_gate.outputs.sources == 'true' && env.SEC_USER_AGENT != '' }}
        continue-on-error: true
        run: python scripts/refresh_research_sources.py --sec-only --max-age-hours 24
      - name: Report missing SEC contact
        if: ${{ !cancelled() && steps.daily_gate.outputs.sources == 'true' && env.SEC_USER_AGENT == '' }}
        run: |
          echo "::warning::SEC refresh skipped. Configure SEC_USER_AGENT with an application name and monitored contact email. Fundamentals remain incomplete."
          echo "SEC refresh skipped: configure SEC_USER_AGENT with an application name and monitored contact email. Fundamentals remain incomplete." >> "$GITHUB_STEP_SUMMARY"
      - name: Report SEC access failure
        if: ${{ steps.sec_refresh.outcome == 'failure' }}
        run: |
          echo "::warning::SEC refresh failed; check the research_sources_refresh pipeline status and SEC step logs. Fundamentals remain incomplete."
          echo "SEC refresh failed; see research_sources_refresh status and SEC step logs. Fundamentals remain incomplete." >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh free analyst consensus
        if: ${{ !cancelled() && steps.daily_gate.outputs.sources == 'true' }}
        continue-on-error: true
        run: python scripts/refresh_analyst_consensus.py --max-age-hours 24
      - name: Collect news and management guidance independently
        if: ${{ !cancelled() && steps.daily_gate.outputs.sources == 'true' }}
        continue-on-error: true
        run: python scripts/refresh_enrichment.py
      - name: Publish the weekly shortlist when Sunday publication is due
        if: ${{ success() && steps.daily_gate.outputs.sources == 'true' }}
        run: python scripts/run_weekly_cycle.py
      - name: Preview weekly readiness after a pipeline change
        if: ${{ success() && steps.daily_gate.outputs.sources == 'true' && github.event_name == 'push' }}
        run: python scripts/generate_weekly_signals.py --dry-run
      - name: Refresh dividend-adjusted portfolio evaluation prices
        if: ${{ !cancelled() && steps.daily_gate.outputs.sources == 'true' }}
        continue-on-error: true
        run: |
          python scripts/refresh_portfolio_returns.py
          python scripts/check_portfolio_comparison.py
      - name: Report delayed daily starts and completions
        if: ${{ always() && steps.daily_gate.outputs.run == 'true' }}
        run: python scripts/report_daily_schedule.py
