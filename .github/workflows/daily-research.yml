name: Daily Market Research

on:
  workflow_dispatch:
  schedule:
    - cron: "37 17 * * 1-5"
      timezone: "America/New_York"

concurrency:
  group: stocks-analyzer-market-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile critical Python files
        run: python -m py_compile scripts/run_daily_cycle.py scripts/validate_daily_cycle.py scripts/ingest_prices.py scripts/build_daily_price_features.py scripts/scan_setups.py scripts/refresh_research_sources.py scripts/ingest_sec_fundamentals.py scripts/build_daily_valuation.py scripts/ingest_massive_earnings.py app/providers/twelvedata.py app/providers/sec.py app/providers/massive.py app/market_calendar.py
      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$TWELVE_DATA_API_KEY"
          test -n "$MASSIVE_API_KEY"
      - name: Refresh market research and evaluate matured signals
        run: python scripts/run_daily_cycle.py
      - name: Confirm persisted pipeline health
        if: success()
        run: python scripts/validate_daily_cycle.py
      - name: Refresh Massive earnings
        if: success()
        run: python scripts/refresh_research_sources.py --earnings-only
      - name: Refresh SEC fundamentals and valuation
        id: sec_refresh
        if: ${{ env.SEC_USER_AGENT != '' }}
        continue-on-error: true
        run: python scripts/refresh_research_sources.py --sec-only
      - name: Report missing SEC contact
        if: ${{ env.SEC_USER_AGENT == '' }}
        run: |
          echo "::warning::SEC refresh skipped. Configure SEC_USER_AGENT with an application name and monitored contact email. Fundamentals remain incomplete."
          echo "SEC refresh skipped: configure SEC_USER_AGENT with an application name and monitored contact email. Fundamentals remain incomplete." >> "$GITHUB_STEP_SUMMARY"
      - name: Report SEC access failure
        if: ${{ steps.sec_refresh.outcome == 'failure' }}
        run: |
          echo "::warning::SEC refresh failed. Market data and Massive earnings completed; check the research_sources_refresh pipeline status and SEC step logs. Fundamentals remain incomplete."
          echo "SEC refresh failed. Market data and Massive earnings completed; see research_sources_refresh status and SEC step logs. Fundamentals remain incomplete." >> "$GITHUB_STEP_SUMMARY"
