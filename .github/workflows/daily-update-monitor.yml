name: Daily Update Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
      timezone: "Asia/Jerusalem"
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-update-monitor.yml"
      - "services/api/scripts/report_daily_schedule.py"
      - "services/api/app/research/daily_schedule.py"

permissions:
  contents: read

# A read-only monitor must not wait behind a long market-data refresh.
concurrency:
  group: stocks-analyzer-health-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check noon completion deadline
        run: python scripts/report_daily_schedule.py --check-deadline
