name: Data Audit Loading
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/data-audit-check.yml"
      - "services/api/sql/research_inventory_performance.sql"
      - "services/api/sql/research_source_inventory.sql"
      - "services/api/scripts/check_data_audit.py"
      - "services/api/app/providers/free_earnings.py"
      - "services/api/app/research/free_calendar.py"
      - "services/api/app/research/earnings_catalysts.py"
      - "services/api/app/research/source_coverage.py"
      - "services/api/sql/free_earnings.sql"
permissions:
  contents: read
concurrency:
  group: stocks-analyzer-data-audit-check
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify dashboard health
        run: python scripts/check_dashboard_health.py
      - name: Verify complete audit within client deadline
        run: python scripts/check_data_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-audit-loading
          path: |
            services/api/data_audit_check.json
            services/api/dashboard_health_check.json
          if-no-files-found: ignore
