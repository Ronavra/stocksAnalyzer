name: Evidence Source Recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-source-recovery.yml"
      - "services/api/app/research/evidence.py"
      - "services/api/scripts/refresh_insider_transactions.py"
      - "services/api/app/providers/macro.py"
permissions:
  contents: read
concurrency:
  group: stocks-analyzer-evidence-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Collect independent macro and economic calendar sources
        run: python scripts/refresh_macro_sources.py
      - name: Retry failed ownership filings with verified issuer routing
        if: always()
        run: python scripts/refresh_insider_transactions.py --retry-errors-only
      - name: Record actual source coverage
        if: always()
        run: python scripts/check_source_coverage.py
