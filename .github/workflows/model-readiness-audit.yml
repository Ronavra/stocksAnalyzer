name: Model Readiness and Coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-readiness-audit.yml"
      - "services/api/sql/model_readiness.sql"
permissions:
  contents: read
concurrency:
  group: stocks-analyzer-model-readiness
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Record whether this host can train and reconcile expired validations
        run: python scripts/local_history_gate.py
      - name: Verify real dashboard health and model readiness
        run: python scripts/check_dashboard_health.py
      - name: Repair one bounded batch of missing reported financial fields
        run: python scripts/repair_financial_coverage.py --limit 25
      - name: Audit research allocations without changing production selections
        run: python scripts/compare_portfolio_risk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-readiness-and-risk
          path: |
            services/api/model_history_gate.json
            services/api/portfolio_risk_research.json
            services/api/dashboard_health_check.json
            services/api/sec_fundamentals_audit.json
          if-no-files-found: ignore
