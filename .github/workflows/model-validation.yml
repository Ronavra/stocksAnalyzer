name: Predictive Model Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * 5"
      timezone: "America/New_York"

concurrency:
  group: stocks-analyzer-model-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile predictive model
        run: python -m py_compile app/research/calibrated_model.py scripts/ablation_predictive_model.py scripts/generate_weekly_signals.py
      - name: Check full-history availability
        id: history_gate
        run: python scripts/local_history_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-history-readiness
          path: services/api/model_history_gate.json
          if-no-files-found: ignore
      - name: Record twenty-session research readiness
        run: python scripts/validate_twenty_day_model.py --readiness-only
      - name: Validate feature groups out of sample
        if: steps.history_gate.outputs.run == 'true'
        run: python scripts/ablation_predictive_model.py

      - name: Validate twenty-session funded account and feature additions
        if: steps.history_gate.outputs.run == 'true'
        run: python scripts/validate_twenty_day_model.py
