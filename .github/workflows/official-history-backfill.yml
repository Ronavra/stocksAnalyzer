name: Official Filing History Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/official-history-backfill.yml"
      - "services/api/app/providers/sec.py"
permissions:
  contents: read
concurrency:
  group: stocks-analyzer-official-history
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/refresh_company_disclosures.py --lookback-days 1825
      - run: python scripts/check_source_coverage.py
        if: always()
