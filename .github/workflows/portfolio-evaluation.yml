name: Portfolio Return Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portfolio-evaluation.yml"
      - "services/api/app/research/portfolio_comparison.py"
      - "services/api/scripts/refresh_portfolio_returns.py"
      - "services/api/scripts/check_portfolio_comparison.py"

concurrency:
  group: stocks-analyzer-portfolio-evaluation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Refresh adjusted evaluation series for frozen picks and SPY
        run: python scripts/refresh_portfolio_returns.py
      - name: Verify complete comparison and record its observed results
        run: python scripts/check_portfolio_comparison.py
