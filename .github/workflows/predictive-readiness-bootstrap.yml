name: Predictive Research Bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: predictive-readiness-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Match observed guidance to pre-publication consensus
        run: python scripts/match_guidance_consensus.py
      - name: Record readiness without promoting any forecast
        run: python scripts/validate_twenty_day_model.py --readiness-only
