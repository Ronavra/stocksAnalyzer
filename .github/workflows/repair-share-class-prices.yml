name: Repair Share Class Prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/api/app/providers/twelvedata.py"

concurrency:
  group: stocks-analyzer-market-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$TWELVE_DATA_API_KEY"
      - name: Backfill both class share prices
        run: python scripts/ingest_prices.py --tickers BF-B BRK-B
      - name: Rebuild price features
        run: python scripts/build_daily_price_features.py
      - name: Rescan opportunities
        run: python scripts/scan_setups.py
      - name: Update internal valuations
        run: python scripts/build_daily_valuation.py
      - name: Confirm price and feature coverage
        run: python scripts/validate_daily_cycle.py
