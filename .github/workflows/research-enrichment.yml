name: Research Enrichment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/api/scripts/refresh_enrichment.py"
      - "services/api/scripts/ingest_news.py"
      - "services/api/app/research/guidance.py"
  workflow_run:
    workflows: ["SEC Fundamentals Refresh"]
    types: [completed]

permissions:
  contents: read
concurrency:
  group: stocks-analyzer-enrichment
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/refresh_enrichment.py
