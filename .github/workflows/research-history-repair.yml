name: Research History Repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/api/scripts/repair_research_history.py
      - services/api/sql/price_session_quality.sql
      - .github/workflows/research-history-repair.yml
concurrency:
  group: stocks-analyzer-market-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check full-history availability
        id: history_gate
        run: python scripts/local_history_gate.py
      - name: Repair historical sessions and labels, then refresh setups
        if: steps.history_gate.outputs.run == 'true'
        run: python scripts/repair_research_history.py
      - name: Verify live API data and policy results
        if: steps.history_gate.outputs.run == 'true'
        run: python scripts/verify_research_release.py
      - uses: actions/upload-artifact@v4
        if: steps.history_gate.outputs.run == 'true'
        with:
          name: research-release-verification
          path: services/api/research_release_verification.json
          if-no-files-found: error
