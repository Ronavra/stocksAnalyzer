name: S&P 500 Membership Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/api/scripts/sync_sp500.py"
      - ".github/workflows/sp500-membership-sync.yml"
  schedule:
    - cron: "0 11 * * 0"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: stocks-analyzer-market-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Sync observed membership intervals
        run: python scripts/sync_sp500.py
