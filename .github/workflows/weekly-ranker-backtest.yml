name: Weekly Ranker Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/api/app/research/weekly_backtest.py"
      - "services/api/scripts/backtest_weekly_ranker.py"
      - ".github/workflows/weekly-ranker-backtest.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check full-history availability
        id: history_gate
        run: python scripts/local_history_gate.py
      - run: python scripts/backtest_weekly_ranker.py --start-date 2024-01-01
        if: steps.history_gate.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-ranker-backtest
          path: services/api/weekly_backtest.json
          if-no-files-found: ignore
