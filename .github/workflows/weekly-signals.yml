name: Weekly Signal Freeze

on:
  workflow_dispatch:
  schedule:
    # Saturday's 08:17 Israel daily refresh collects Friday's US close.
    # Allow its 180-minute timeout plus a buffer; the job also checks DB freshness.
    - cron: "17 12 * * 6"
      timezone: "Asia/Jerusalem"

concurrency:
  group: stocks-analyzer-market-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$MASSIVE_API_KEY"
      - name: Compile research source refresh files
        run: python -m py_compile scripts/refresh_research_sources.py scripts/ingest_sec_fundamentals.py scripts/build_daily_valuation.py scripts/ingest_massive_earnings.py scripts/generate_weekly_signals.py scripts/backtest_calibrated_model.py app/providers/sec.py app/providers/massive.py app/research/calibrated_model.py
      - name: Ensure research sources are fresh
        run: python scripts/refresh_research_sources.py --earnings-only --max-age-hours 4
      - name: Verify SEC fundamentals before financial ranking
        run: python scripts/refresh_research_sources.py --sec-only --max-age-hours 24
      - name: Refresh free analyst consensus before selection
        continue-on-error: true
        run: python scripts/refresh_analyst_consensus.py --max-age-hours 24
      - name: Freeze up to 5 research candidates at 5d 10d and 20d horizons
        run: python scripts/run_weekly_cycle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-weekly-selection
          path: services/api/financial_selection.json
          if-no-files-found: ignore
